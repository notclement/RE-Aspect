<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- maximum-scale + touch-action (app.css) stop double-tap / accidental page zoom.
		     Pinch-zoom on the map/plan/3D canvases is handled by our own gesture code. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#F7F6F1" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#101311" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Show clients the light in every room, before they visit. Sunlight studies for Singapore listings." />
		<!-- Link preview for the app itself (agents & designers). scripts/og-routes.mjs swaps in the
		     buyer card on the shared page (/s) after the build. -->
		<meta property="og:site_name" content="RE:Aspect" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="RE:Aspect — Show clients the light in every room" />
		<meta property="og:description" content="Sunlight studies for Singapore listings." />
		<meta property="og:image" content="%sveltekit.env.SITE_ORIGIN%/og/reaspect-app.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="RE:Aspect: an illustrated sunlit living room." />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon-16.png" sizes="16x16" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="RE:Aspect" />
		<script>
			// Apply the saved theme before first paint so there is no colour flash (ids mirror src/lib/config/themes.ts).
			(function () {
				var el = document.documentElement;
				try {
					var ids = ['light', 'dark', 'japandi', 'scandi', 'modern', 'industrial', 'peranakan', 'tropical'];
					var darkIds = { dark: 1, industrial: 1 };
					var t = localStorage.getItem('rea.theme') || 'system';
					if (ids.indexOf(t) < 0) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					el.dataset.theme = t;
					el.dataset.mode = darkIds[t] ? 'dark' : 'light';
				} catch (e) {
					el.dataset.theme = 'light';
					el.dataset.mode = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
