<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- maximum-scale + touch-action (app.css) stop double-tap / accidental page zoom.
		     Pinch-zoom on the map/plan/3D canvases is handled by our own gesture code. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="RE:Aspect — see how sunlight moves through a home, room by room." />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="RE:Aspect" />
		<script>
			// Apply the saved theme before first paint so there is no light/dark flash.
			(function () {
				try {
					var t = localStorage.getItem('rea.theme') || 'system';
					var dark =
						t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
